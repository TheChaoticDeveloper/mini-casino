<!DOCTYPE html>
<html>

<head>
<title>Blackjack</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🃏 Blackjack</h1>

<h2>💰 Money: $<span id="money">1000</span></h2>

<label>Bet:</label>
<input type="number" id="bet" value="50">

<h2 id="player"></h2>
<h3 id="playerTotal"></h3>

<h2 id="dealer"></h2>
<h3 id="dealerTotal"></h3>

<button onclick="startGame()">Start Game</button>
<button onclick="hit()">Hit</button>
<button onclick="stand()">Stand</button>
<button onclick="resetGame()">New Round</button>

<h3 id="result"></h3>

<a href="index.html">
<button>Back</button>
</a>

<script src="blackjack.js"></script>

</body>

</html>
