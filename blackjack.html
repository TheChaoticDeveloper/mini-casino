<!DOCTYPE html>
<html>

<head>
<title>Blackjack</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🃏 Blackjack</h1>

<h2>💰 Money: $<span id="money">1000</span></h2>

<label>Bet:</label>
<input type="number" id="bet" value="50">

<h2>Dealer Hand</h2>
<div id="dealer"></div>
<h3 id="dealerTotal"></h3>

<h2>Your Hand</h2>
<div id="player"></div>
<h3 id="playerTotal"></h3>

<div id="startButtons">
<button onclick="startGame()">Start Game</button>
</div>

<div id="gameButtons" style="display:none">
<button onclick="hit()">Hit</button>
<button onclick="stand()">Stand</button>
</div>

<div id="endButtons" style="display:none">
<button onclick="resetGame()">New Round</button>
</div>

<h3 id="result"></h3>

<a href="index.html">
<button>Back</button>
</a>

<script src="blackjack.js"></script>

</body>
</html>
